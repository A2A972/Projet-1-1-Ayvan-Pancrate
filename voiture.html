<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulaire voiture</title>
</head>
<body bgcolor="red">
	<section>
	<h1>Ajout d'un nouveau véhicule</h1>
	<table width="70%" >

     <label for="marque">Marque :</label>
	<select id="marque" name="marque">
	<option value="Peugeot">Peugeot</option>
	<option value="Mercedes">Mercedes</option>
	<option value="Renault">Renault</option>
	</select>
	<br>
	 <label for="immatriculation">Immatriculation :</label>
	 <input type="texte" name="immatriculation">
	 <br>

	<form action=# method="post">
	<label for="couleur">Couleur :</label>
	<input type="texte" id="Couleur" name="Couleur">	<!-- Input type text met le formulaire en mode texte-->
	<br>

	<label for="Date d'immatriculation">Date d'immatriculation :</label>
	<input type="date" id="Date d'immatriculation" name="Date d'immatriculation"><!--
	La mm chose juste pour les prénoms(br)pour retour a la ligne. label for c'est pour définir la zone de texte-->
	<br>

    <label for="Kilométrage">Kilométrage:</label>
    <input type="number" id="Kilométrage" name="Kilométrage">
    <!-- Pour la date de naissance utilise date-->
    <br>

<p>Boite de vitesse:</p>
	<label for=" Hybride"> Hybride</label>
	<input type="radio"id=" Hybride" name="mm" value="oui">
	<label for=" Électrique"> Électrique</label>
	<input type="radio"id=" Électrique" name="mm" value="non">
	<label for="Diesel ">Diesel </label>
	<input type="radio"id="Diesel " name="mm" value="non">
	<label for="Essence">Essence</label>
	<input type="radio"id="Essence" name="mm" value="non">
<br>


    <p>ETAT</p>
	<label for="Occasion">Occasion</label>
	<input type="radio"id="Occasion" name="mm" value="oui">
	<label for="Neuf">Neuf</label>
	<input type="radio"id="Neuf" name="mm" value="non">
<br>

 <p>Boite de vitesse</p>
	<label for="manu">manuel</label>
	<input type="radio"id="manu" name="mm" value="oui">
	<label for="auto">auto</label>
	<input type="radio"id="auto" name="mm" value="non">

    <p>Nombre de portes:</p>
	<label for=" 3"> 3</label>
	<input type="radio"id=" 3" name="mm" value="oui">
	<label for="4"> 4</label>
	<input type="radio"id="4" name="mm" value="non">
	<label for="5"> 5</label>
	<input type="radio"id="5" name="mm" value="non">
	<label for="6+">6+</label>
	<input type="radio"id="6+" name="mm" value="non">
<br>

<button type="submit">Enregistrer</button>

<button type="reset">Annuler</button>



</table>
	</form>
	</section>

</body>
</html>
